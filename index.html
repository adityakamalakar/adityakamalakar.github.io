                        <div className="h-1 bg-[#262626]">
                          <div className="h-full bg-[#B8976C]" style={{ width: `${it.proficiency}%` }} />
                        </div>
                      </div>
                    ))}
                  </div>
                ))}
              </div>
            </section>

            {/* FUTURE STUDIO SECTION */}
            <section id="studio" className="max-w-7xl mx-auto px-4 sm:px-8 py-16 border-t border-[#222]">
              <div className="max-w-3xl mb-8">
                <span className="text-[10px] font-mono uppercase tracking-widest text-[#B8976C] block mb-2">
                  Future Practice Vision
                </span>
                <h2 className="text-3xl sm:text-5xl font-serif text-white font-normal mb-2">
                  {profileData.futureStudio.name}
                </h2>
                <p className="text-sm font-serif italic text-[#C5A880] mb-4">
                  "{profileData.futureStudio.tagline}"
                </p>
                <p className="text-xs sm:text-sm text-[#8C8C8C] leading-relaxed">
                  {profileData.futureStudio.vision}
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                {profileData.futureStudio.values.map((v, i) => (
                  <div key={i} className="bg-[#181818] border border-[#282828] p-5">
                    <span className="text-xl font-serif text-[#B8976C] block mb-2">0{i + 1}</span>
                    <h4 className="text-sm font-serif text-white font-medium mb-1">{v.title}</h4>
                    <p className="text-xs text-[#888] leading-relaxed">{v.description}</p>
                  </div>
                ))}
              </div>

              <div className="bg-[#161616] border border-[#333] p-4 text-xs text-[#777] leading-relaxed">
                <span className="font-mono text-[#999] uppercase block mb-0.5">Professional Disclosure:</span>
                {profileData.futureStudio.disclaimer}
              </div>
            </section>

            {/* CONTACT SECTION */}
            <section id="contact" className="max-w-7xl mx-auto px-4 sm:px-8 py-16 border-t border-[#222]">
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-6 space-y-4">
                  <span className="text-[10px] font-mono uppercase tracking-widest text-[#B8976C] block">
                    Direct Contact Channels
                  </span>
                  <h2 className="text-3xl sm:text-5xl font-serif text-white font-normal">
                    Let's Build or Collaborate
                  </h2>
                  <p className="text-xs sm:text-sm text-[#8C8C8C] leading-relaxed">
                    Available for architectural positions, freelance drafting and working drawings,
                    interior transformations, and 3D visualization.
                  </p>
                  <div className="flex flex-wrap gap-3 pt-2">
                    <button
                      onClick={() => window.open(`https://wa.me/${profileData.contact.whatsapp}`, '_blank')}
                      className="px-5 py-3 bg-[#25D366] text-black font-semibold text-xs uppercase"
                    >
                      💬 WhatsApp Direct
                    </button>
                    <a
                      href={`mailto:${profileData.contact.email}`}
                      className="px-5 py-3 border border-[#B8976C] text-[#E5C79E] text-xs uppercase"
                    >
                      ✉ Send Email
                    </a>
                  </div>
                </div>

                <div className="lg:col-span-6 grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                  <div className="bg-[#181818] border border-[#282828] p-5 space-y-1">
                    <span className="text-[10px] font-mono text-[#B8976C] uppercase block">Official Email</span>
                    <div className="text-white font-mono break-all">{profileData.contact.email}</div>
                  </div>
                  <div className="bg-[#181818] border border-[#282828] p-5 space-y-1">
                    <span className="text-[10px] font-mono text-[#B8976C] uppercase block">WhatsApp / Phone</span>
                    <div className="text-white font-mono">{profileData.contact.phone}</div>
                  </div>
                  <div className="bg-[#181818] border border-[#282828] p-5 space-y-1">
                    <span className="text-[10px] font-mono text-[#B8976C] uppercase block">Location</span>
                    <div className="text-white font-serif">{profileData.contact.location}</div>
                  </div>
                  <div className="bg-[#181818] border border-[#282828] p-5 space-y-1">
                    <span className="text-[10px] font-mono text-[#B8976C] uppercase block">Networks</span>
                    <div className="text-[#AAA] space-x-3">
                      <a href={profileData.contact.linkedin} target="_blank" className="hover:text-white">LinkedIn</a>
                      <a href={profileData.contact.instagram} target="_blank" className="hover:text-white">Instagram</a>
                    </div>
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="bg-[#101010] border-t border-[#222] py-12 px-4 sm:px-8 text-xs text-[#777]">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
              <div>
                © {new Date().getFullYear()} Ar. Aditya N. Kamalakar (B.Arch, Dr. Baliram Hiray College of Architecture, Mumbai). All rights reserved.
              </div>
              <div className="flex items-center space-x-6">
                <span className="italic text-[11px] text-[#555]">Indraprastha Architects & Design Studio (Future Studio Identity)</span>
                <button
                  onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                  className="text-[#AAA] hover:text-white font-mono uppercase text-[10px]"
                >
                  Back to Top ↑
                </button>
              </div>
            </div>
          </footer>

          {/* PROJECT DETAIL MODAL */}
          {activeModalProject && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6">
              <div className="bg-[#181818] border border-[#333] w-full max-w-4xl max-h-[90vh] overflow-y-auto p-6 space-y-6 text-white relative">
                <div className="flex justify-between items-start border-b border-[#282828] pb-3">
                  <div>
                    <span className="text-[10px] font-mono text-[#B8976C] uppercase block">{activeModalProject.typology}</span>
                    <h2 className="text-2xl font-serif">{activeModalProject.title}</h2>
                    <span className="text-xs text-[#777] font-mono">{activeModalProject.location} • {activeModalProject.year}</span>
                  </div>
                  <button onClick={() => setActiveModalProject(null)} className="text-[#888] hover:text-white text-lg">✕</button>
                </div>

                <div className="aspect-[16/10] overflow-hidden bg-black">
                  <img src={activeModalProject.coverImage} alt={activeModalProject.title} className="w-full h-full object-cover" />
                </div>

                <div className="space-y-3">
                  <h4 className="text-xs font-mono uppercase text-[#B8976C]">Design Concept & Scope</h4>
                  <p className="text-xs text-[#CCC] leading-relaxed">{activeModalProject.description}</p>
                </div>

                <div className="p-4 bg-[#141414] border border-[#262626]">
                  <span className="text-[10px] font-mono uppercase text-[#B8976C] block mb-2">Ar. Aditya's Specific Contribution:</span>
                  <ul className="text-xs text-[#AAA] space-y-1">
                    {activeModalProject.myContribution.map((c, i) => (
                      <li key={i}>• {c}</li>
                    ))}
                  </ul>
                </div>

                <div className="flex justify-between items-center pt-3 border-t border-[#262626]">
                  <button
                    onClick={() => {
                      setFormData({ ...formData, message: `Inquiring about project similar to ${activeModalProject.title}` });
                      setActiveModalProject(null);
                      scrollTo('enquiry-section');
                    }}
                    className="px-4 py-2 bg-[#B8976C] text-[#141414] font-bold text-xs uppercase"
                  >
                    Inquire Similar Project
                  </button>
                  <button onClick={() => setActiveModalProject(null)} className="text-xs text-[#888] hover:text-white">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
